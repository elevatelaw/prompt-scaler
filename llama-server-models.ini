; Sample llama-server dev config for prompt-scaler.
;
; This is not necessarily a good production config, or even the best available
; models in each category. These models are chosen to be small and usable on
; a local laptop, even without a decent GPU, and to be usable for unit tests.
;
; See https://llama-cpp.com/getting-started/ for llama-server installation.
;
; You can run llama-server as follows:
;
;   llama-server --models-preset llama-server-models.ini --host 127.0.0.1 --port 8080
;
; You may need to adjust `host` if you want to serve to local Docker containers
; or VMs. Models download from Hugging Face on first load.
;
; File format notes:
;
; Section names are the model IDs clients pass as "model", so they match the
; engine profiles. Each model stanza apparently needs an explicit hf-repo. An
; empty stanza starts its child server with no model, so nothing is downloaded
; and it never loads. This isn't how I remember it working before.

version = 1

; Settings shared by all presets. Can be overridden.
[*]

;=========================================================================
; General LLMs
;
; These support `chat` and (in some cases) `ocr`. For these, just treat
; llama-server like a normal OpenAI-compatible endpoint and use
; /chat/completions.

; A "phone-sized" LLM that supports both `chat` and `ocr` modes of
; `prompt-scaler`. Suitable for very bare bones unit tests.
[unsloth/gemma-4-E2B-it-GGUF:Q4_K_M]
hf-repo = unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
; I believe this allows up to 131072, but it isn't worth it with such
; a toy model.
ctx-size = 32768
; Google generation_config.json and Unsloth docs: one setting for all
; use cases (no separate coding mode).
temp = 1.0
top-p = 0.95
top-k = 64
; Not in Google's config. HF transformers applies no min-p, so turn off
; llama.cpp's default (0.05) to match the reference sampler.
min-p = 0.0
repeat-penalty = 1.0

;=========================================================================
; Dedicated OCR models
;
; This is a fairly select group--it only contains pure OCR models that
; are available in GGUF format, _without_ needing to be part of a
; multi-step pipeline.

; A sample OCR model. See the docs; this requires a fixed prompt and
; specific output formats for each supported mode.
;
; See:
; - https://huggingface.co/ATH-MaaS/OvisOCR3
; - https://huggingface.co/mradermacher/OvisOCR3-GGUF
[mradermacher/OvisOCR3-GGUF:Q8_0]
hf-repo = mradermacher/OvisOCR3-GGUF:Q8_0
ctx-size = 32768
; generation_config.json: greedy decoding.
temp = 0.0
top-k = 1
repeat-penalty = 1.0
; Card: apply_chat_template(..., enable_thinking=False).
reasoning = off
; Card: min_pixels 448^2, max_pixels 2880^2. At 32px per token
; (patch 16, merge 2) that's 196 to 8100 tokens.
image-min-tokens = 196
image-max-tokens = 8100

;=========================================================================
; Decision models for `prompt-scaler decide`
;
; These are "Jev-style" decision models, for use with
; `prompt-scaler decide`. We don't need a ton of configuration here,
; because these don't do normal sampling at all.
;
; See:
; - https://huggingface.co/blog/ggml-org/decision-models-in-llamacpp
; - https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md#post-v1systemone-typesafe-compatible-system-one-api

; A decision model that runs fairly well on a MacBook with no special
; hardware.
[ggml-org/Kev-4B-GGUF:Q4_K_M]
hf-repo = ggml-org/Kev-4B-GGUF:Q4_K_M
ctx-size = 32768

; A very, very tiny decision model when you need speed over quality.
[ggml-org/Laya-GGUF:Q8_0]
hf-repo = ggml-org/Laya-GGUF:Q8_0
ctx-size = 32768

; TODO: Pick an image-capable model from the llama.cpp list.
