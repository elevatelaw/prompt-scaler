max_width = 90

# Switch to short-form field init syntax when possible, for consistency.
use_field_init_shorthand = true

# Nightly-only options (`unstable_features`, `group_imports`,
# `imports_granularity`) are deliberately NOT listed here: stable `cargo fmt`,
# which is what `just check` runs, prints a warning for every option it can't
# use. They are passed on the command line by `just sort-imports` instead, and
# nightly `--config` values are merged with the stable settings above.
